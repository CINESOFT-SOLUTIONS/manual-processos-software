name: Compilar Documentos (LaTeX & Beamer)

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-pdfs:
    name: Compilação de Artefatos ABNT e Slides
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Tectonic (Typesetting Engine)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version

      - name: Executar Script de Compilação
        run: |
          chmod +x ./scripts/compilar.sh
          ./scripts/compilar.sh

      - name: Verificar se os PDFs foram gerados
        run: |
          test -f trabalho_latex/manual-processos-software.pdf || (echo "❌ Erro: manual-processos-software.pdf não foi gerado!" && exit 1)
          test -f slides_latex/apresentacao-manual.pdf || (echo "❌ Erro: apresentacao-manual.pdf não foi gerado!" && exit 1)
          echo "✅ Todos os PDFs foram gerados com sucesso!"

      - name: Upload dos PDFs como Artefatos da Execução
        uses: actions/upload-artifact@v4
        with:
          name: cinedoom-documentos-pdf
          path: |
            trabalho_latex/manual-processos-software.pdf
            slides_latex/apresentacao-manual.pdf
          retention-days: 30

      - name: Publicar Release no GitHub (Apenas em Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            trabalho_latex/manual-processos-software.pdf
            slides_latex/apresentacao-manual.pdf
          generate_release_notes: true
          draft: false
          prerelease: false
