name: Compilar Documentos (LaTeX & Markdown)

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-pdfs:
    name: Compilação de Artefatos ABNT e Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Tectonic (Typesetting Engine)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version

      - name: Executar Script de Compilação
        run: |
          chmod +x ./scripts/compilar.sh
          ./scripts/compilar.sh

      - name: Validar geração dos artefatos
        run: |
          test -f manual/manual-processos-software.md || (echo "[error] manual-processos-software.md was not generated." && exit 1)
          test -f manual/latex/template/main.pdf || (echo "[error] main.pdf was not generated." && exit 1)
          echo "[ci:ok] All document artifacts verified successfully."

      - name: Upload dos PDFs como Artefatos da Execução
        uses: actions/upload-artifact@v4
        with:
          name: cinedoom-documentos-pdf
          path: |
            manual/latex/template/main.pdf
            manual/manual-processos-software.md
          retention-days: 30

      - name: Publicar Release no GitHub (Apenas em Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manual/latex/template/main.pdf
            manual/manual-processos-software.md
          generate_release_notes: true
          draft: false
          prerelease: false
